name: Build Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Descomprimir el proyecto (.zip) y localizarlo
        id: proj
        run: |
          mkdir -p _src
          for z in ./*.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d _src
          done
          f=$(find . -name settings.gradle.kts -not -path './.git/*' -not -path './.github/*' | head -n1)
          if [ -z "$f" ]; then
            echo "::error::No se encontró settings.gradle.kts"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Proyecto en: $(dirname "$f")"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3

      - name: Crear local.properties (opcional, con secretos)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          {
            echo "MAP_TILE_URL=${{ secrets.MAP_TILE_URL }}"
            echo "MAP_ATTRIBUTION=${{ secrets.MAP_ATTRIBUTION }}"
            echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}"
            echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}"
            echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}"
          } > local.properties

      - name: Tests unitarios
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v5
        with:
          name: fuckrun-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir informe de tests (si falla)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: ${{ steps.proj.outputs.dir }}/app/build/reports/tests/
