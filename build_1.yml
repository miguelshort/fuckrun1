name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # Las claves son opcionales: si no existen los secretos, la app compila igual
      # (mapas OSM de desarrollo y Club como "servicio no configurado").
      - name: Crear local.properties
        env:
          MAP_TILE_URL: ${{ secrets.MAP_TILE_URL }}
          MAP_ATTRIBUTION: ${{ secrets.MAP_ATTRIBUTION }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "MAP_TILE_URL=$MAP_TILE_URL"
            echo "MAP_ATTRIBUTION=$MAP_ATTRIBUTION"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          } > local.properties

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: fuckrun-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
